<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 210" width="170" height="210" role="img" aria-label="A small original droid illustration with a glowing lens.">
<title>A small droid</title>
<!-- Original artwork for github.com/Zenzee7711. Sits on its own dark panel so
     it reads the same on GitHub's light and dark themes. -->
<defs>
  <radialGradient id="lens" cx="0.38" cy="0.34" r="0.75">
    <stop offset="0" stop-color="#e4f6d4"/>
    <stop offset="0.45" stop-color="#b8df9f"/>
    <stop offset="1" stop-color="#4e7a46"/>
  </radialGradient>
  <filter id="lensGlow" x="-120%" y="-120%" width="340%" height="340%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
</defs>

<rect width="170" height="210" rx="16" fill="#101c26"/>
<rect x="0.6" y="0.6" width="168.8" height="208.8" rx="15.4" fill="none" stroke="#b8df9f" stroke-opacity="0.22"/>

<!-- antenna -->
<path d="M85 46 V30" stroke="#6f8696" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="85" cy="25" r="3.6" fill="#f0b357"/>

<!-- head -->
<rect x="52" y="46" width="66" height="44" rx="12" fill="#22323f" stroke="#445c6b" stroke-width="1.4"/>
<circle cx="85" cy="68" r="17" fill="#b8df9f" opacity="0.18" filter="url(#lensGlow)"/>
<circle cx="85" cy="68" r="13" fill="#0d1a20" stroke="#b8df9f" stroke-width="1.6"/>
<circle cx="85" cy="68" r="8.5" fill="url(#lens)"/>
<circle cx="81" cy="64" r="2.6" fill="#f2fbec" opacity="0.9"/>

<!-- neck -->
<rect x="76" y="89" width="18" height="10" fill="#2c3f4d"/>

<!-- body -->
<rect x="46" y="97" width="78" height="77" rx="13" fill="#1b2a35" stroke="#3d5160" stroke-width="1.4"/>
<path d="M57 119 H113" stroke="#33485a" stroke-width="1.4" stroke-linecap="round"/>

<!-- indicator row -->
<circle cx="63" cy="134" r="4" fill="#f0b357"/>
<circle cx="76" cy="134" r="3.2" fill="#4a6372"/>
<circle cx="88" cy="134" r="3.2" fill="#4a6372"/>

<!-- grille -->
<rect x="58" y="146" width="54" height="16" rx="5" fill="#15222c" stroke="#33485a" stroke-width="1.1"/>
<path d="M68 149 V159 M78 149 V159 M88 149 V159 M98 149 V159" stroke="#2b3d4b" stroke-width="1.6" stroke-linecap="round"/>

<!-- legs and feet -->
<rect x="57" y="174" width="12" height="17" rx="5" fill="#2c3f4d"/>
<rect x="101" y="174" width="12" height="17" rx="5" fill="#2c3f4d"/>
<rect x="50" y="189" width="26" height="9" rx="4.5" fill="#445c6b"/>
<rect x="94" y="189" width="26" height="9" rx="4.5" fill="#445c6b"/>
</svg>
